name: Build and release

on:
  push:
    branches: [main]
    tags: ["v[0-9]*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: gabriel-andreescu/BethesdaModKit/.github/workflows/build.yml@bbbe23d1f09ab5673270a5b01ed452f6523413d7
    with:
      run-tests: true
      publish-nexus: true
    secrets:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
